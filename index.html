<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TruthCheck</title>
  <meta name="description" content="Check if a headline or a social media screenshot is real.">
  <meta name="theme-color" content="#0F1F10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- iPhone: run full screen from the home screen -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TruthCheck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { --bg: #0F1F10; --ink: #FFFFFF; --muted: #A3ADA3; --lime: #C6F19D; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing: border-box; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: var(--bg); transition: opacity .5s ease; z-index: 2; }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
    #splash p { margin: 0; color: var(--muted); font-size: 15px; text-align: center; max-width: 280px; line-height: 1.45; }
    .bar { width: 140px; height: 4px; border-radius: 2px; background: #1E3720; overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--lime);
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/icon-192.png" alt="">
    <h1>TruthCheck</h1>
    <div class="bar" aria-hidden="true"></div>
    <p id="msg">Starting the checker…</p>
  </div>
  <iframe id="app" title="TruthCheck" allow="clipboard-read; clipboard-write"
          src="https://newscheckerai1234.streamlit.app/?embed=true"></iframe>
  <script>
    const splash = document.getElementById("splash");
    const msg = document.getElementById("msg");
    document.getElementById("app").addEventListener("load", () => splash.classList.add("done"));
    // The free server sleeps when unused; say so instead of looking frozen.
    setTimeout(() => {
      if (!splash.classList.contains("done")) msg.textContent = "Waking up the server. This can take up to a minute.";
    }, 6000);
    if (!navigator.onLine) msg.textContent = "You're offline. TruthCheck needs the internet to check claims.";
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
