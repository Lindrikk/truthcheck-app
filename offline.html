<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TruthCheck – offline</title>
  <meta name="theme-color" content="#0F1F10">
  <style>
    html, body { margin: 0; height: 100%; background: #0F1F10; color: #FFFFFF;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 20px; }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 0; color: #A3ADA3; max-width: 300px; line-height: 1.5; }
    button { margin-top: 8px; padding: 12px 22px; border: 0; border-radius: 10px; background: #C6F19D;
      color: #0F1F10; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>TruthCheck searches fact-checks and the news online, so it needs an internet connection.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
